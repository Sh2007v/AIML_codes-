<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Bar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    text-align:center;
    padding-top:80px;
    font-family:Arial, sans-serif;
}

.container{
    width:400px;
    height:25px;
    border:2px solid navy;
    margin:30px auto;
}

.bar{
    width:0%;
    height:100%;
    background:red;
}

/* Start animation only when checkbox is checked */
#start:checked ~ .container .bar{
    animation:loading 5s linear forwards;
}

@keyframes loading{
    0%{
        width:0%;
    }
    25%{
        width:25%;
    }
    50%{
        width:50%;
    }
    75%{
        width:75%;
    }
    100%{
        width:100%;
    }
}

.load{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}

label{
    font-size:18px;
    cursor:pointer;
}
</style>

</head>
<body>

<input type="checkbox" id="start">
<label for="start">Start Loading</label>

<div class="container">
    <div class="bar"></div>
</div>

<div class="load">
    Loading...
</div>

</body>
</html>
