<html>
    <style>
        .square{
            width:200px;
            height:200px;
            margin:auto;
            position:relative;
            top:150px;
            border:6px solid cyan;
            background-color:yellow;
            animation:circular 7s infinite ;
        }
        @keyframes circular{
            0%{transform: rotate(0deg);}
            33%{transform: rotate(90deg);}
            66%{transfrom:rotate(90deg);}
            100%{transform:rotate(360deg);}
        }
    </style>
    <body>
        <div class = "square"></div>
    </body>
</html>
