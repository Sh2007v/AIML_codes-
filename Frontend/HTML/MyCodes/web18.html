<!DOCTYPE html>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    text-align:center;
    padding-top:80px;
    font-family:Arial, sans-serif;
}

#start{
    display:none;
}

label{
    font-size:18px;
    cursor:pointer;
    padding:10px 20px;
    background:navy;
    color:white;
    border-radius:5px;
}

.container{
    width:100px;
    height:100px;
    margin:40px auto;
}

.loader{
    width:100%;
    height:100%;
    border:10px solid lightgray;
    border-top:10px solid red;
    border-radius:50%;
}

#start:checked ~ .container .loader{
    animation:loading 1s linear infinite;
}

@keyframes loading{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.load{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}
</style>

</head>
<body>

<input type="checkbox" id="start">
<label for="start">Start Loading</label>

<div class="container">
    <div class="loader"></div>
</div>

<div class="load">
    Loading...
</div>

</body>
</html>
