<style>
    .square{
        width:20px;
        height:20px;
        background: red;
        position: relative;
        animation: mymoves 5s infinite;
    }
    @keyframes mymoves{
        0%{left:0px;top:0px;}
        25%{left:300px;top:0px;}
        50%{left:300px;top:200px;}
        75%{left:0px;top:200px;}
        100%{left:0px;top:0px;}
    }
</style>
<body>
    <div class = "square"></div>
</body>
