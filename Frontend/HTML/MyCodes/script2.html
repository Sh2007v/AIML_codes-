<html>
    <table width="40%" border="2">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>City</th>
        </tr>
        <tr>
            <td id="name"></td>
            <td id="email"></td>
            <td id="city"></td>
        </tr>
    </table>
    <script>
        
        var nm = prompt("Enter your Name: ");
        var em = prompt("Enter your mail id: ");
        var ct = prompt("Enter your City: ");

        document.getElementById("name").innerText = nm;
        document.getElementById("email").innerText = em;
        document.getElementById("city").innerText = ct;
    
    </script>
</html>
