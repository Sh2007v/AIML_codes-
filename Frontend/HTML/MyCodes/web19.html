<!----Pseudo Class : nth-child()-->
<html>
    <body>
        <h1>Example of nth child</h1>
        <div>
            <p> This is 1st text in div.</p>
        </div>
        <div>
            <p>This is 2nd text in div.</p>
        </div>
        <div>
            <p>This is 3rd text in div.</p>
        </div>
        <ul>
            <li>First List Item</li>
            <li>Second List Item</li>
            <li>Third List Item</li>
            <li>Fourth List Item</li>
        </ul>
        <style>
        li:nth-child(2){
            background-color:lightgreen;
        }
        :nth-child(4){
            background-color: yellow;
        }
        div:nth-child(2){
            background-color:red;
        }
        div:nth-of-type(2){
            background-color:red;
        }
        </style>
    </body>
</html>
