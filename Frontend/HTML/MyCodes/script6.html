 // JS Events
       <!DOCTYPE html>
<html>
<head>
    <title>JavaScript Button Example</title>

    <script>
        function fun() {
            alert("Welcome !")
        }
    </script>
</head>

<body>

    <!-- Calling a JavaScript function -->
    <button name="btn1" onclick="fun()">
        Click here
    </button>

    <br><br>

    <!-- Writing JavaScript directly inside onclick -->
    <button name="btn2" onclick='alert("Welcome User !")'>
        Click here
    </button>

</body>
</html>
