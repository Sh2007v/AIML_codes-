<!DOCTYPE >
<html>
<body>

<script>
    let count = parseInt(prompt("How many items do you want to add?"));

    let style = prompt("Enter list style: ");

    document.write(<ol type='${style}'>);

    for (let i = 1; i <= count; i++) {
        let item = prompt(Enter item ${i}:);
        document.write(<li>${item}</li>);
    }
    document.write("</ol>");
</script>

</body>
</html>
