<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Layout</title>

<style>
    *{
        margin: 0 ;
        padding:0;
    }
.container{
    width: 100vw;
    height: 100vh;
    margin:  auto;
    text-align: center;
    display: grid;
    grid-template-columns: 413px 413px 413px;
    grid-template-rows: 197px 197px 197px;
    grid-column-gap:20px ;
    grid-row-gap: 20px;}
</style>

</head>
<body>

<div class="container">
    <div style="background:red;">Item 1</div>
    <div style="background:green;">Item 2</div>
    <div style="background:blue;">Item 3</div>
    <div style="background:yellow;">Item 4</div>
    <div style="background:pink;">Item 5</div>
    <div style="background:cyan;">Item 6</div>
    <div style="background:purple;">Item 7</div>
    <div style="background:orange;">Item 8</div>
    <div style="background:gray;">Item 9</div>
</div>

</body>
</html>
