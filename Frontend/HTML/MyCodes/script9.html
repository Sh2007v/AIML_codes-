<html>
    <body>
        <input type="number" id="num" placeholder="Enter any number">
        <button id="btn1">Display Number Table</button>
        <br>
        <div id="numbertable"></div>

    </body>
    <script>
            document.getElementById("btn1").onclick = function() {

                let num = document.getElementById("num").value;
                let result = "";

                for(let i = 1; i <= 10; i++) {
                    result += num + " × " + i + " = " + (num * i) + "<br>";
                }

                document.getElementById("numbertable").innerHTML = result;
            };
        </script>
</html>
