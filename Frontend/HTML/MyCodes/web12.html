<html>
    <head>
    <style>
        .square{
            width: 200px;
            height: 200px;
            background-color: green;
            border: 2px solid navy;
            animation: mycolor 1s 2;
        }
        @keyframes mycolor{
            from{ 
                background-color: yellow;
            }
            to{
                background-color: green;
            }
        }
    </style>
    </head>
    <body>
        <div class ="square"></div>
    </body>
</html>
